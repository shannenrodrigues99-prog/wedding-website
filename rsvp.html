<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP | Shannen & Samarth</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:"Playfair Display", serif;
      background:#ffffff;
      color:#111;
      min-height:100vh;
      overflow-x:hidden;
    }

    /* ===== NAV ===== */

    .topnav{
      position:fixed;
      top:28px;
      left:50%;
      transform:translateX(-50%);
      width:calc(100% - 80px);

      display:flex;
      justify-content:flex-start;
      align-items:center;

      font-family:"Montserrat", sans-serif;
      font-weight:500;
      text-transform:uppercase;
      letter-spacing:0.34em;
      font-size:11px;

      z-index:1000;

      padding-bottom:18px;

      color:#2B2B2B;

      border-bottom:1px solid rgba(43,43,43,.10);

      background:#ffffff;

      overflow:hidden;
    }

    .topnav .left{
      display:flex;
      gap:56px;
      align-items:center;
    }

    .topnav a{
      color:#2B2B2B;
      text-decoration:none;
      opacity:.78;
      transition:opacity .2s ease;
    }

    .topnav a:hover{
      opacity:1;
    }

    .topnav .rsvp{
      margin-left:56px;

      padding:4px 14px;

      border:1px solid rgba(43,43,43,.55);
      border-radius:999px;

      letter-spacing:0.34em;

      opacity:1;
    }

    /* ===== PAGE ===== */

    .wrap{
      min-height:100vh;

      padding:150px 80px 90px;

      display:grid;

      grid-template-columns:1fr 0.72fr;

      gap:78px;

      align-items:center;

      max-width:1280px;

      margin:0 auto;
    }

    .content{
      text-align:center;

      padding-left:30px;
    }

    .eyebrow{
      font-family:"Montserrat", sans-serif;

      font-size:10px;

      letter-spacing:0.42em;

      text-transform:uppercase;

      color:#777;

      margin-bottom:20px;
    }

    h1{
      font-family:"Playfair Display", serif;

      font-size:clamp(40px, 5vw, 68px);

      font-weight:400;

      letter-spacing:0.04em;

      line-height:0.9;

      margin-bottom:30px;
    }

    .message{
      font-family:"Montserrat", sans-serif;

      font-size:13px;

      font-weight:300;

      line-height:2;

      letter-spacing:0.04em;

      color:#555;

      max-width:560px;

      margin:0 auto 36px;
    }

    .rsvp-main-button{
      display:inline-block;

      padding:14px 34px;

      border:1px solid rgba(43,43,43,.65);

      border-radius:999px;

      font-family:"Montserrat", sans-serif;

      font-size:11px;

      font-weight:500;

      letter-spacing:0.32em;

      text-transform:uppercase;

      color:#111;

      text-decoration:none;

      background:white;

      transition:.25s ease;
    }

    .rsvp-main-button:hover{
      background:#111;

      color:white;
    }

    .rsvp-deadline{
      margin-top:22px;

      font-family:"Montserrat", sans-serif;

      font-size:10px;

      letter-spacing:0.24em;

      text-transform:uppercase;

      color:#888;
    }

    .photo-wrap{
      width:100%;

      height:68vh;

      min-height:520px;

      overflow:hidden;

      position:relative;
    }

    .photo-wrap img{
      width:100%;

      height:100%;

      object-fit:cover;

      display:block;

      filter:none;
    }

    .photo-wrap::after{
      display:none;

    }

      /* ===== DESKTOP ONLY ===== */

    @media (min-width:769px){
      html,
      body{
        height:100%;
        overflow:hidden;
      }

      .wrap{
        height:100vh;
        height:100dvh;
        min-height:0;

        padding:80px 60px 0;
        max-width:1200px;

        grid-template-columns:auto minmax(0, 1fr);
        grid-template-rows:minmax(0, 1fr);
        gap:50px;

        align-items:center;
      }

      .photo-wrap{
        grid-column:1;
        grid-row:1;

        height:72vh;
        height:min(72dvh, calc(100dvh - 100px));
        min-height:0;

        width:auto;
        max-width:100%;
        aspect-ratio:4 / 5;

        align-self:center;
        justify-self:start;
      }

      .content{
        grid-column:2;
        grid-row:1;

        width:100%;
        max-width:500px;
        padding-left:0;

        justify-self:center;
        text-align:center;
      }

      .eyebrow{
        margin-bottom:20px;
      }

      h1{
        font-size:clamp(40px, 5vw, 68px);
        font-weight:400;
        letter-spacing:0.04em;
        line-height:0.9;
        margin-bottom:30px;
      }

      .message{
        width:100%;
        max-width:560px;

        font-size:13px;
        font-weight:300;
        line-height:2;
        letter-spacing:0.04em;

        text-align:center;
        margin:0 auto 36px;
        text-wrap:wrap;
      }

      .rsvp-deadline{
        max-width:none;
        margin-top:22px;

        font-size:10px;
        font-weight:400;
        letter-spacing:0.24em;
        line-height:normal;

        text-transform:uppercase;
        color:#888;
      }
    }

/* Hidden outside mobile */

.mobile-menu-button,
.mobile-menu-overlay{
  display:none;
}
    
    /* ===== MOBILE ===== */

    @media (max-width:768px){

      body{
        overflow-y:auto;
      }

      .topnav{
        top:calc(25px + env(safe-area-inset-top));

        width:100%;

        padding:0 20px 16px;

        flex-direction:column;

        align-items:center;

        gap:16px;

        font-size:10px;

        letter-spacing:0.28em;

        border-bottom:1px solid rgba(43,43,43,.10);

        isolation:isolate;
      }

      .topnav::before{
        content:"";

        position:absolute;

        left:0;
        right:0;

        top:calc(-25px - env(safe-area-inset-top));

        height:calc(100% + 25px + env(safe-area-inset-top));

        background:rgba(255,255,255,0.82);

        backdrop-filter:blur(14px) saturate(160%);
        -webkit-backdrop-filter:blur(14px) saturate(160%);

        z-index:-1;
      }

      .topnav .left{
        gap:24px;

        justify-content:center;

        flex-wrap:wrap;
      }

      .topnav .rsvp{
        margin-left:0;

        padding:8px 16px;
      }

      .wrap{
        min-height:auto;

        padding:170px 24px 60px;

        display:flex;

        flex-direction:column;

        gap:42px;
      }

      .content{
        padding-left:0;
      }

      h1{
        font-size:44px;

        margin-bottom:26px;
      }

      .message{
        font-size:11.5px;

        line-height:1.8;
      }

      .photo-wrap{
        width:88%;
        height:auto;
        min-height:0;
        aspect-ratio:4 / 5;
        margin:0 auto;
      }
    }
/* ===== UPDATED MOBILE RSVP ===== */

@media (max-width:768px){

  body{
    overflow-y:auto;
    background:#ffffff;
  }

  /* Navigation */

  .topnav{
    position:absolute;
    top:0;
    left:0;
    transform:none;

    width:100%;

    padding:
      calc(20px + env(safe-area-inset-top))
      20px
      18px;

    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:flex-end;

    background:transparent;
    border:none;

    z-index:1000;
  }

  .topnav::before{
    display:none;
  }

  .topnav .left,
  .topnav .rsvp{
    display:none;
  }

  .mobile-menu-button{
    display:flex;
    align-items:center;
    justify-content:center;

    min-width:112px;
    height:44px;
    padding:0 22px;

    color:#fff;
    background:rgba(20,20,20,.92);

    border:1px solid rgba(255,255,255,.90);
    border-radius:999px;

    box-shadow:0 5px 18px rgba(0,0,0,.20);

    font-family:"Montserrat",sans-serif;
    font-size:10px;
    font-weight:500;
    letter-spacing:.32em;
    line-height:1;
    text-transform:uppercase;

    appearance:none;
    cursor:pointer;
  }

  /* Layout */

  .wrap{
    width:100%;
    max-width:none;
    min-height:auto;

    margin:0;
    padding:0;

    display:flex;
    flex-direction:column;
    gap:0;
  }

  /* Photograph first */

  .photo-wrap{
    order:1;

    width:100%;
    height:56svh;
    min-height:360px;

    margin:0;
    aspect-ratio:auto;

    overflow:hidden;
  }

  .photo-wrap img{
    display:block;
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;
  }

  /* RSVP content underneath */

  .content{
    order:2;

    width:100%;
    max-width:none;

    padding:42px 28px 64px;

    background:#ffffff;
    text-align:left;
  }

  .eyebrow{
    margin-bottom:18px;

    color:#444;

    font-size:10px;
    font-weight:500;
    letter-spacing:.42em;
    text-align:left;
  }

  h1{
    margin-bottom:28px;

    color:#111;

    font-size:50px;
    line-height:1;
    letter-spacing:0;
    text-align:left;
  }

  .message{
    width:100%;
    max-width:340px;

    margin:0 0 30px;

    color:#333;

    font-size:12px;
    font-weight:400;
    line-height:1.9;
    letter-spacing:.015em;
    text-align:left;
  }

  .rsvp-main-button{
    width:min(76vw,300px);
    height:50px;
    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    background:#1d1d1d;

    border:1px solid #1d1d1d;
    border-radius:999px;

    font-size:10px;
    letter-spacing:.28em;
    line-height:1;
    text-align:center;
  }

  .rsvp-deadline{
    margin-top:20px;

    color:#444;

    font-family:"Montserrat",sans-serif;
    font-size:9px;
    font-weight:500;
    letter-spacing:.20em;
    line-height:1.6;
    text-align:left;
    text-transform:uppercase;
  }

  /* Blurred photograph menu */

  .mobile-menu-overlay{
    position:fixed;
    inset:0;
    z-index:3000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
      calc(24px + env(safe-area-inset-top))
      24px
      calc(24px + env(safe-area-inset-bottom));

    overflow:hidden;
    isolation:isolate;

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:
      opacity .3s ease,
      visibility .3s ease;
  }

  .mobile-menu-overlay::before{
    content:"";

    position:absolute;
    inset:-25px;

    background:
      url("Khichkeh-91 2.jpg")
      center center / cover
      no-repeat;

    filter:blur(11px);
    transform:scale(1.08);

    z-index:-2;
  }

  .mobile-menu-overlay::after{
    content:"";

    position:absolute;
    inset:0;

    background:rgba(15,15,15,.26);

    z-index:-1;
  }

  .mobile-menu-overlay.is-open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  /* Close button */

  .mobile-menu-close{
    position:absolute;
    top:calc(18px + env(safe-area-inset-top));
    right:18px;

    width:48px;
    height:48px;
    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    background:transparent;
    border:none;

    font-family:Arial,sans-serif;
    font-size:42px;
    font-weight:300;
    line-height:1;

    appearance:none;
    cursor:pointer;
  }

  /* Menu content */

  .mobile-menu-content{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    transform:translateY(-2svh);
  }

  .mobile-menu-heading{
    margin-bottom:28px;

    color:#fff;

    font-family:"Montserrat",sans-serif;
    font-size:11px;
    font-weight:500;
    letter-spacing:.42em;
    text-transform:uppercase;
  }

  .mobile-menu-links{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:14px;
  }

  .mobile-menu-links a{
    width:min(74vw,300px);
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    background:rgba(25,25,25,.40);

    border:1px solid rgba(255,255,255,.72);
    border-radius:999px;

    box-shadow:0 6px 20px rgba(0,0,0,.12);

    -webkit-backdrop-filter:blur(14px) saturate(130%);
    backdrop-filter:blur(14px) saturate(130%);

    font-family:"Montserrat",sans-serif;
    font-size:10px;
    font-weight:500;
    letter-spacing:.30em;
    text-decoration:none;
    text-transform:uppercase;
  }

  .mobile-menu-links a:active{
    background:rgba(0,0,0,.88);
    transform:scale(.98);
  }

  body.menu-is-open{
    overflow:hidden;
  }

}

</style>
</head>

<body>

<nav class="topnav">

  <button
    class="mobile-menu-button"
    id="mobileMenuButton"
    type="button"
    aria-controls="mobileMenuOverlay"
    aria-expanded="false"
  >
    Menu
  </button>

  <div class="left">
      <a href="index.html">Home</a>
      <a href="welcome.html">Welcome</a>
      <a href="schedule.html">Schedule</a>
      <a href="faqs.html">FAQs</a>
    </div>

    <a class="rsvp" href="rsvp.html" style="font-weight:600; opacity:1;">RSVP</a>

  </nav>
<!-- MOBILE MENU OVERLAY -->

<div
  class="mobile-menu-overlay"
  id="mobileMenuOverlay"
  aria-hidden="true"
>
  <button
    class="mobile-menu-close"
    id="mobileMenuClose"
    type="button"
    aria-label="Close menu"
  >
    &times;
  </button>

  <div class="mobile-menu-content">

    <div class="mobile-menu-heading">
      Menu
    </div>

    <div class="mobile-menu-links">
      <a href="index.html">Home</a>
      <a href="welcome.html">Welcome</a>
      <a href="schedule.html">Schedule</a>
      <a href="faqs.html">FAQs</a>
    </div>

  </div>
</div>

  <main class="wrap">

    <section class="content">

      <div class="eyebrow">
        Kindly Respond
      </div>

      <h1>RSVP</h1>

      <div class="message">
        We look forward to celebrating with you.<br>
        Please continue to our RSVP page to confirm your attendance.
      </div>

<a class="rsvp-main-button" href="https://withjoy.com/shannen-and-samarth/rsvp" target="_blank">
  Continue to RSVP
</a>

      <div class="rsvp-deadline">
        Please respond by 1 December 2026
      </div>

    </section>

    <section class="photo-wrap">

      <img src="Khichkeh-91 2.jpg" alt="Shannen and Samarth">

    </section>

  </main>

<script>

  if (sessionStorage.getItem("siteUnlocked") !== "1") {
    window.location.replace("index.html");
  }

  const mobileMenuButton =
    document.getElementById("mobileMenuButton");

  const mobileMenuOverlay =
    document.getElementById("mobileMenuOverlay");

  const mobileMenuClose =
    document.getElementById("mobileMenuClose");

  function openMobileMenu(){
    mobileMenuOverlay.classList.add("is-open");
    mobileMenuOverlay.setAttribute("aria-hidden", "false");
    mobileMenuButton.setAttribute("aria-expanded", "true");
    document.body.classList.add("menu-is-open");
  }

  function closeMobileMenu(){
    mobileMenuOverlay.classList.remove("is-open");
    mobileMenuOverlay.setAttribute("aria-hidden", "true");
    mobileMenuButton.setAttribute("aria-expanded", "false");
    document.body.classList.remove("menu-is-open");
  }

  mobileMenuButton.addEventListener("click", openMobileMenu);

  mobileMenuClose.addEventListener("click", closeMobileMenu);

  mobileMenuOverlay.addEventListener("click", event => {
    if(event.target === mobileMenuOverlay){
      closeMobileMenu();
    }
  });

  document.addEventListener("keydown", event => {
    if(event.key === "Escape"){
      closeMobileMenu();
    }
  });

</script>

</body>
</html>
